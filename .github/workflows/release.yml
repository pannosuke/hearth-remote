name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate tag format and compute version code
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Error: Tag must be in format v1.2.3"
          exit 1
        fi
        VERSION=${TAG#v}
        
        # Parse semver components
        MAJOR=$(echo "$VERSION" | cut -d. -f1)
        MINOR=$(echo "$VERSION" | cut -d. -f2)
        PATCH=$(echo "$VERSION" | cut -d. -f3)
        
        # Compute versionCode: MAJOR*10000 + MINOR*100 + PATCH
        # This allows up to 99 minor and 99 patch versions per major
        VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
        
        echo "TAG=$TAG" >> $GITHUB_ENV
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
        
        echo "Version: $VERSION (versionCode: $VERSION_CODE)"
    
    - name: Check signing secrets
      run: |
        if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "::error::KEYSTORE_BASE64 secret is not set"
          echo "Please add the following secrets to your repository:"
          echo "  - KEYSTORE_BASE64: Base64-encoded keystore file"
          echo "  - KEYSTORE_PASSWORD: Keystore password"
          echo "  - KEY_ALIAS: Key alias in the keystore"
          echo "  - KEY_PASSWORD: Key password"
          echo ""
          echo "See README.md for instructions on generating these secrets."
          exit 1
        fi
        if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
          echo "::error::KEYSTORE_PASSWORD secret is not set"
          exit 1
        fi
        if [ -z "${{ secrets.KEY_ALIAS }}" ]; then
          echo "::error::KEY_ALIAS secret is not set"
          exit 1
        fi
        if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
          echo "::error::KEY_PASSWORD secret is not set"
          exit 1
        fi
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Decode keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
    
    - name: Update version in build.gradle.kts
      run: |
        sed -i "s/versionCode = [0-9]*/versionCode = ${{ env.VERSION_CODE }}/" app/build.gradle.kts
        sed -i "s/versionName = \".*\"/versionName = \"${{ env.VERSION }}\"/" app/build.gradle.kts
    
    - name: Build Release APK
      env:
        KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --no-daemon
    
    - name: Rename APK
      run: |
        mv app/build/outputs/apk/release/app-release.apk hearth-remote-${{ env.TAG }}.apk
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Hearth Remote ${{ env.TAG }}
        body: |
          ## Hearth Remote ${{ env.TAG }}
          
          Download `hearth-remote-${{ env.TAG }}.apk` and install via Obtainium or sideload directly.
          
          ### Installation
          1. In Obtainium, add this repository as a source
          2. The app will automatically detect new releases
          
          ### What's New
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
        files: hearth-remote-${{ env.TAG }}.apk
        draft: false
        prerelease: false
    
    - name: Clean up keystore
      if: always()
      run: rm -f release.keystore
